# 패키지가 src/ 아래에 있어서, 그냥 `python -m clap_launcher` 하면 못 찾습니다.
# `pip install -e .` 한 번으로 경로가 잡히도록 최소 설정만 둡니다.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clap-launcher"
version = "1.0.0"
description = "박수 두 번으로 업무용 프로그램을 한 번에 실행하는 Windows 유틸리티"
requires-python = ">=3.12"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "PyYAML>=6.0",
    # 뉴모피즘 UI의 부드러운 그림자와 아이콘 안티앨리어싱에 쓴다.
    # Tkinter에는 그림자도 안티앨리어싱도 없어서 이미지를 직접 만들어야 한다.
    # 없어도 프로그램은 동작한다(그림자 없이, 자글자글하게 그려진다).
    "Pillow>=10.0",
    # 트레이 아이콘. 없으면 트레이 기능만 빠지고 창 모드로 정상 동작한다.
    "pystray>=0.19",
]

[project.scripts]
# 설치 후 터미널에서 `clapdesk` 만 쳐도 실행됩니다.
# (패키지 폴더 이름 clap_launcher 는 그대로 둔다 - import 경로가 바뀌면 전 파일이 흔들린다)
clapdesk = "clap_launcher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
